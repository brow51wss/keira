<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host Keira — Versions</title>
  <meta name="description" content="Choose a Host Keira website version. Each link opens that version in a new tab.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0a09;
      --gold: #d4af37;
      --gold-hover: #e6c458;
      --ivory: #f5ebd7;
      --muted: #d9d0be;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--ivory);
      font-family: Montserrat, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 28px;
    }

    .mark {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--gold);
      line-height: 1;
    }

    .mark span {
      font-family: "Playfair Display", serif;
      font-size: 13px;
      letter-spacing: 0.32em;
    }

    .mark i {
      font-family: "Great Vibes", cursive;
      font-style: normal;
      font-size: 42px;
    }

    h1 {
      margin: 18px 0 0;
      font-family: "Playfair Display", serif;
      font-weight: 400;
      font-size: clamp(36px, 6vw, 56px);
      line-height: 1.08;
    }

    p {
      margin: 16px 0 0;
      max-width: 36em;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    a.version {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 14px 22px;
      background: var(--gold);
      color: var(--bg);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
    }

    a.version:hover,
    a.version:focus-visible {
      background: var(--gold-hover);
    }

    a.version:focus-visible {
      outline: 2px solid var(--ivory);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div>
      <p class="mark"><span>HOST</span><i>Keira</i></p>
      <h1>Two versions.</h1>
      <p>Open either site in a new tab.</p>
    </div>
    <nav aria-label="Website versions">
      <a class="version" href="claude/design/Host%20Keira.dc.html" target="_blank" rel="noopener noreferrer">Claude</a>
      <a class="version" href="astra/dist/index.html" target="_blank" rel="noopener noreferrer">Astra</a>
    </nav>
  </main>
</body>
</html>
